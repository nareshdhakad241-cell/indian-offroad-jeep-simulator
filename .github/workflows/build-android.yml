name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot and official export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Create temporary Android debug keystore
        run: |
          mkdir -p build
          keytool -genkeypair -v \
            -keystore build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and validate project
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee build/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" build/import.log; then
            echo "Godot script validation failed"
            exit 1
          fi

      - name: Run headless scene smoke test
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee build/runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" build/runtime.log; then
            echo "Godot runtime smoke test failed"
            exit 1
          fi

      - name: Export APK using official templates
        run: |
          set -o pipefail
          godot --headless --verbose --path . --export-debug "Android" build/IndianOffroadJeep-debug.apk 2>&1 | tee build/export.log
          test -s build/IndianOffroadJeep-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Indian-Offroad-Jeep-APK
          path: build/IndianOffroadJeep-debug.apk
          if-no-files-found: error
