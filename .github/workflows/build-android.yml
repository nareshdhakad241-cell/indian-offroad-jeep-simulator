name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Install Android build template directly
        run: |
          set -euxo pipefail
          TEMPLATE="$(find "$HOME/.local/share/godot/export_templates" -name android_source.zip -print -quit)"
          test -n "$TEMPLATE"
          mkdir -p android/build
          unzip -q "$TEMPLATE" -d android/build
          chmod +x android/build/gradlew
          touch android/build/.gdignore
          echo "4.3.stable" > android/.build_version
          echo "=== Android template contents ==="
          find android/build -maxdepth 2 -type f | head -60
          echo "=== Installed export templates ==="
          find "$HOME/.local/share/godot/export_templates/4.3.stable" -maxdepth 1 -type f -printf '%f\n'

      - name: Reimport project with Android template
        run: godot --headless --editor --path . --quit --verbose

      - name: Export APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/IndianOffroadJeep-debug.apk 2>&1 | tee build/export.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Indian-Offroad-Jeep-APK
          path: build/IndianOffroadJeep-debug.apk
          if-no-files-found: error
